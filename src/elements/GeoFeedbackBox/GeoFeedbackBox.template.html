<geo-feedback-box
  v-bind="$props"
  v-on="$listeners"
  :variant="variant"
>
  <template #leadingAccessoryItem>
    <font-awesome-icon
      :icon="icon"
      aria-hidden
      fixed-width
    />
  </template>
  <!-- @slot Use this slot to customized displayed message -->
  <template #content>
    <slot name="content" />
  </template>
  <!-- @slot Use this slot to show additional actions after message -->
  <template #actions>
    <slot name="actions" />
  </template>
</geo-feedback-box>
